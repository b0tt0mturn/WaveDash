<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wave Dash - Live Interactive Spectral Analysis</title>
  
  <!-- Leaflet CSS & JS for Interactive Map -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  
  <!-- Plotly.js for Dynamic Vector Charts -->
  <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>

  <style>
    html, body {
      height: 100%;
      overflow-y: auto; /* Enables page vertical scrolling */
      -webkit-overflow-scrolling: touch;
    }
    body { 
      font-family: Arial, sans-serif; 
      margin: 0; 
      padding: 10px; 
      background: #f4f6f8; 
      box-sizing: border-box;
    }
    h2 { 
      margin-top: 0; 
      color: #1a252f; 
      font-size: 1.3rem; 
      text-align: center;
    }
    
    .grid-container { 
      display: flex; 
      flex-direction: column; 
      gap: 15px; 
      padding-bottom: 20px;
    }
    .panel { 
      background: white; 
      padding: 12px; 
      border-radius: 8px; 
      box-shadow: 0 2px 5px rgba(0,0,0,0.1); 
    }

    /* Side-by-Side Map & Parameters Container */
    .map-controls-row {
      display: flex;
      flex-direction: row;
      gap: 12px;
      align-items: stretch;
    }

    .map-col {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .controls-col {
      flex: 1.2;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-width: 0;
    }

    /* Two-Column Grid Layout for Parameter Inputs */
    .params-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px 10px;
    }

    .span-full {
      grid-column: span 2;
    }

    #map { 
      height: 100%; 
      min-height: 250px;
      width: 100%; 
      border-radius: 6px; 
    }

    .control-group { 
      margin-bottom: 2px; 
    }
    .control-group label { 
      display: block; 
      font-size: 10px; 
      font-weight: bold; 
      margin-bottom: 2px; 
      white-space: nowrap;
    }
    .control-group input, .control-group select { 
      width: 100%; 
      padding: 4px 6px; 
      box-sizing: border-box; 
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 11px;
    }

    .btn { 
      background: #007bff; 
      color: white; 
      border: none; 
      padding: 8px 10px; 
      border-radius: 4px; 
      cursor: pointer; 
      width: 100%; 
      margin-top: 6px;
      font-weight: bold;
      font-size: 12px;
    }
    .btn:hover { background: #0056b3; }
    .status-msg { font-size: 10px; color: #6c757d; margin-top: 4px; font-style: italic; text-align: center; }
    
    /* Player Controls */
    .player-controls { 
      display: flex; 
      gap: 4px; 
      align-items: center; 
      justify-content: space-between; 
      margin-bottom: 10px; 
    }
    .player-btn { 
      flex: 1;
      padding: 8px 4px; 
      font-weight: bold; 
      font-size: 12px;
      cursor: pointer; 
      background: #e9ecef; 
      border: 1px solid #ced4da; 
      border-radius: 4px; 
    }
    .player-btn:hover { background: #dee2e6; }
    .slider-container { display: flex; flex-direction: column; gap: 5px; margin-top: 5px; }
    .slider-container input { width: 100%; }

    /* Plot Layout */
    .plots-grid { 
      display: flex; 
      flex-direction: column; 
      gap: 20px; 
    }
    .plot-box { 
      height: 270px; 
      width: 100%;
    }

    /* Desktop View & Landscape Overrides */
    @media (min-width: 768px) {
      body { padding: 15px; }
      h2 { font-size: 1.5rem; text-align: left; }
      .plots-grid { 
        display: grid; 
        grid-template-columns: 1fr 1fr; 
      }
      .full-width { grid-column: span 2; }
      .plot-box { height: 320px; }
      .slider-container { flex-direction: row; align-items: center; }
    }
  </style>
</head>
<body>

  <h2>🌊 Wave Dash - Ocean Wave Spectral Dashboard</h2>

  <div class="grid-container">
    <!-- Map & Parameters Panel -->
    <div class="panel">
      <div class="map-controls-row">
        
        <!-- Left Side: Interactive Map -->
        <div class="map-col">
          <label style="font-size: 12px; font-weight: bold; margin-bottom: 4px;">Select Wave Buoy:</label>
          <div id="map"></div>
        </div>

        <!-- Right Side: Two-Column Parameters & Controls -->
        <div class="controls-col">
          <div class="params-grid">
            
            <div class="control-group span-full">
              <label>Station ID:</label>
              <input type="text" id="stationId" value="41159">
            </div>

            <div class="control-group span-full">
              <label>Start Date & Time (EST/EDT):</label>
              <input type="datetime-local" id="startDate">
            </div>
            
            <div class="control-group">
              <label>Hours to Plot:</label>
              <input type="number" id="hoursToPlot" value="12" min="1" max="24">
            </div>

            <div class="control-group">
              <label>Period Limit (s):</label>
              <input type="number" id="periodLimit" value="18" min="5" max="30">
            </div>

            <div class="control-group">
              <label>Min Y-Limit (Energy):</label>
              <input type="number" step="0.1" id="minYLimit" value="2.0" min="0.1">
            </div>

            <div class="control-group">
              <label>Surf Swell Energy:</label>
              <input type="number" step="0.1" id="surfEnergy" value="1.0">
            </div>

            <div class="control-group">
              <label>Surf Swell Period (s):</label>
              <input type="number" id="surfPeriod" value="9">
            </div>

            <div class="control-group">
              <label>Crit Angle (°):</label>
              <input type="number" id="critAngle" value="120">
            </div>

            <div class="control-group span-full">
              <label>Peak Thresh (m²/Hz):</label>
              <input type="number" step="0.05" id="peakThreshold" value="0.1">
            </div>

          </div>

          <button class="btn" id="fetchBtn" onclick="fetchAndProcessData()">Update</button>
          <div id="statusMsg" class="status-msg">Ready.</div>
        </div>

      </div>
    </div>

    <!-- Plots & Timeline Player Panel -->
    <div class="panel">
      <!-- Media Player Bar -->
      <div class="player-controls">
        <button class="player-btn" onclick="firstFrame()">⏮ First</button>
        <button class="player-btn" onclick="stepFrame(-1)">◀ Rev</button>
        <button class="player-btn" id="playBtn" onclick="togglePlay()">▶ Play</button>
        <button class="player-btn" onclick="stepFrame(1)">Next ▶</button>
        <button class="player-btn" onclick="lastFrame()">Last ⏭</button>
      </div>

      <div class="slider-container">
        <span id="timestampDisplay" style="font-weight: bold; text-align: center;">Loading...</span>
        <input type="range" id="timeSlider" min="0" max="0" value="0" oninput="onSliderMove(this.value)">
      </div>

      <!-- Live Plots -->
      <div class="plots-grid" style="margin-top: 15px;">
        <div id="polarPlot" class="plot-box"></div>
        <div id="spectralPlot" class="plot-box"></div>
        <div id="heatmapPlot" class="plot-box full-width"></div>
      </div>
    </div>
  </div>

  <script>
    let timeSeriesData = [];
    let currentFrameIdx = 0;
    let isPlaying = false;
    let playInterval = null;
    let mapMarkersGroup = null;
    let dynamicBuoys = [];

    // Custom afmhot colorscale capped at Light Yellow (starts at pure black)
    const afmhotYellowCap = [
      [0.0, '#000000'], // Black
      [0.25, '#660000'], // Dark Red
      [0.5, '#CC3300'], // Red-Orange
      [0.75, '#FF6600'], // Bright Orange
      [1.0, '#FFFF80']  // Light Yellow
    ];

    // Global Plotly Configuration to Disable Toolbar and Zoom Captures
    const plotlyConfig = {
      displayModeBar: false,
      scrollZoom: false,
      responsive: true
    };

    // Formats a JS Date object into Eastern Time string (New York)
    function formatToET(dateObj) {
      const options = {
        timeZone: 'America/New_York',
        year: 'numeric',
        month: '2-digit',
        day: '2-digit',
        hour: '2-digit',
        minute: '2-digit',
        hour12: false,
        timeZoneName: 'short'
      };
      const formatter = new Intl.DateTimeFormat('en-US', options);
      const parts = formatter.formatToParts(dateObj);
      
      let year, month, day, hour, minute, timeZoneName;
      for (const p of parts) {
        if (p.type === 'year') year = p.value;
        if (p.type === 'month') month = p.value;
        if (p.type === 'day') day = p.value;
        if (p.type === 'hour') hour = p.value;
        if (p.type === 'minute') minute = p.value;
        if (p.type === 'timeZoneName') timeZoneName = p.value;
      }
      return `${year}-${month}-${day} ${hour}:${minute} ${timeZoneName}`;
    }

    function setDefaultStartDate() {
      const now = new Date();
      // Format to current EST/EDT for input default
      const estFormatter = new Intl.DateTimeFormat('en-US', {
        timeZone: 'America/New_York',
        year: 'numeric', month: '2-digit', day: '2-digit',
        hour: '2-digit', hour12: false
      });
      const parts = estFormatter.formatToParts(now);
      let year, month, day, hour;
      for (const p of parts) {
        if (p.type === 'year') year = p.value;
        if (p.type === 'month') month = p.value;
        if (p.type === 'day') day = p.value;
        if (p.type === 'hour') hour = p.value;
      }
      
      const formattedDateTime = `${year}-${month}-${day}T${hour}:00`;
      document.getElementById('startDate').value = formattedDateTime;
    }

    // --- Switch Map Engine to Esri Ocean Basemap ---
    const map = L.map('map').setView([34.211, -76.944], 7);

    // Esri Ocean Base Layer (No API key required)
    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Ocean/World_Ocean_Base/MapServer/tile/{z}/{y}/{x}', {
      attribution: 'Tiles &copy; Esri &mdash; Sources: GEBCO, NOAA, CHS, GEOBASS, GAA',
      maxZoom: 13
    }).addTo(map);

    // Esri Ocean Reference/Labels Overlay
    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Ocean/World_Ocean_Reference/MapServer/tile/{z}/{y}/{x}', {
      maxZoom: 13
    }).addTo(map);

    mapMarkersGroup = L.layerGroup().addTo(map);

    function getDistanceMiles(lat1, lon1, lat2, lon2) {
      const R = 3958.8; 
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                Math.sin(dLon/2) * Math.sin(dLon/2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
      return R * c;
    }

    async function updateDynamicBuoyDatabase(activeStationId) {
      const WORKER_URL = "https://noaa-wave-proxy.rwnster.workers.dev";
      const targetUrl = "https://www.ndbc.noaa.gov/activestations.xml";
      const proxyUrl = `${WORKER_URL}?url=${encodeURIComponent(targetUrl)}`;

      mapMarkersGroup.clearLayers();

      try {
        const response = await fetch(proxyUrl);
        if (!response.ok) throw new Error("Could not fetch active NOAA stations database.");
        
        const xmlText = await response.text();
        const parser = new DOMParser();
        const xmlDoc = parser.parseFromString(xmlText, "text/xml");
        const stationNodes = xmlDoc.getElementsByTagName("station");

        let allWaveStations = [];
        let targetBuoy = null;

        for (let i = 0; i < stationNodes.length; i++) {
          const node = stationNodes[i];
          const id = node.getAttribute("id") ? node.getAttribute("id").toLowerCase() : "";
          const lat = parseFloat(node.getAttribute("lat"));
          const lon = parseFloat(node.getAttribute("lon"));
          const name = node.getAttribute("name") || `Station ${id.toUpperCase()}`;
          const pgm = node.getAttribute("pgm") || "";
          const spec = node.getAttribute("spec") || "";
          const wave = node.getAttribute("wave") || "";

          const hasWaveData = pgm.includes("wave") || spec.toLowerCase() === "y" || wave.toLowerCase() === "y";

          if (!isNaN(lat) && !isNaN(lon)) {
            const stationObj = { id: id.toUpperCase(), name: `${id.toUpperCase()} - ${name}`, lat, lon, hasWaveData };
            if (hasWaveData) allWaveStations.push(stationObj);
            if (id === activeStationId.toLowerCase()) targetBuoy = stationObj;
          }
        }

        if (targetBuoy) {
          dynamicBuoys = allWaveStations.filter(b => getDistanceMiles(targetBuoy.lat, targetBuoy.lon, b.lat, b.lon) <= 200);

          dynamicBuoys.forEach(b => {
            const dist = getDistanceMiles(targetBuoy.lat, targetBuoy.lon, b.lat, b.lon);
            const isTarget = (b.id === activeStationId.toUpperCase());

            // Use L.circleMarker instead of default image-based markers
            const marker = L.circleMarker([b.lat, b.lon], {
              radius: isTarget ? 8 : 6,
              color: isTarget ? '#d9534f' : '#007bff',
              fillColor: isTarget ? '#ff4d4d' : '#3399ff',
              fillOpacity: 0.9,
              weight: 2
            }).addTo(mapMarkersGroup);

            marker.bindPopup(`<b>Station ${b.id}</b><br>${b.name}<br>Distance: ${dist.toFixed(1)} miles`);
            marker.on('click', () => {
              document.getElementById('stationId').value = b.id;
              fetchAndProcessData();
            });
          });

          L.circle([targetBuoy.lat, targetBuoy.lon], {
            radius: 200 * 1609.34,
            color: '#007bff',
            fillColor: '#007bff',
            fillOpacity: 0.08,
            weight: 1.5
          }).addTo(mapMarkersGroup);

          map.setView([targetBuoy.lat, targetBuoy.lon], 7);
        }
      } catch (err) {
        console.warn("Metadata list fallback active for local testing:", err);
        // Fallback: render target station marker directly if XML query is unavailable or fails
        const targetId = activeStationId.toUpperCase();
        const fallbackMarker = L.circleMarker([34.211, -76.944], {
          radius: 8,
          color: '#d9534f',
          fillColor: '#ff4d4d',
          fillOpacity: 0.9,
          weight: 2
        }).addTo(mapMarkersGroup);
        
        fallbackMarker.bindPopup(`<b>Station ${targetId}</b><br>Active Station`);
      }
    }

    async function fetchNDBCFile(stationId, ext) {
      const targetUrl = `https://www.ndbc.noaa.gov/data/realtime2/${stationId}.${ext}`;
      const WORKER_URL = "https://noaa-wave-proxy.rwnster.workers.dev";
      const proxyUrl = `${WORKER_URL}?url=${encodeURIComponent(targetUrl)}`;

      const response = await fetch(proxyUrl);
      if (!response.ok) {
        throw new Error(`HTTP ${response.status} from Cloudflare worker while fetching .${ext}`);
      }

      const text = await response.text();
      if (!text || text.trim().length === 0 || text.includes("403 Forbidden")) {
        throw new Error(`Invalid data payload received for .${ext}`);
      }

      return parseNDBCFormat(text);
    }

    function parseNDBCFormat(text) {
      const lines = text.trim().split('\n');
      const timestamps = [];
      let frequencies = [];
      const matrices = [];

      for (let line of lines) {
        line = line.trim();
        if (line.startsWith('#') || !line) continue;

        const parts = line.split(/\s+/);
        if (parts.length < 6) continue;

        const matches = [...line.matchAll(/([-+]?\d+(?:\.\d+)?)\s+\(([-+]?\d+(?:\.\d+)?)\)/g)];
        if (matches.length === 0) continue;

        if (frequencies.length === 0) {
          frequencies = matches.map(m => parseFloat(m[2]));
        }

        // Parse NOAA UTC time into standard JS Date object and convert to Eastern Time
        const utcDate = new Date(Date.UTC(parts[0], parts[1] - 1, parts[2], parts[3], parts[4]));
        const etDateStr = formatToET(utcDate);

        timestamps.push(etDateStr);
        matrices.push(matches.map(m => parseFloat(m[1])));
      }
      return { timestamps, frequencies, matrices };
    }

    async function fetchAndProcessData() {
      pause();
      const status = document.getElementById('statusMsg');
      const stationId = document.getElementById('stationId').value.trim();
      const hoursToPlot = parseInt(document.getElementById('hoursToPlot').value);
      const selectedStartDate = document.getElementById('startDate').value;

      try {
        status.innerText = "Locating nearby wave buoys within 200mi...";
        await updateDynamicBuoyDatabase(stationId);

        status.innerText = "Fetching buoy data via worker...";
        const [spec, alpha1, alpha2] = await Promise.all([
          fetchNDBCFile(stationId, 'data_spec'),
          fetchNDBCFile(stationId, 'swdir'),
          fetchNDBCFile(stationId, 'swdir2')
        ]);

        status.innerText = "Processing spectral matrices...";

        let startIndex = 0;
        if (selectedStartDate) {
          const targetTime = new Date(selectedStartDate).getTime();
          for (let k = 0; k < spec.timestamps.length; k++) {
            const frameTime = new Date(spec.timestamps[k]).getTime();
            if (frameTime <= targetTime) {
              startIndex = k;
              break;
            }
          }
        }

        const endIndex = Math.min(startIndex + hoursToPlot, spec.timestamps.length);
        timeSeriesData = [];

        for (let i = endIndex - 1; i >= startIndex; i--) {
          timeSeriesData.push({
            timestamp: spec.timestamps[i],
            frequencies: spec.frequencies,
            energy: spec.matrices[i],
            alpha1: alpha1.matrices[i],
            alpha2: alpha2.matrices[i]
          });
        }

        if (timeSeriesData.length === 0) {
          throw new Error("No data found for the selected start date.");
        }

        const slider = document.getElementById('timeSlider');
        slider.max = timeSeriesData.length - 1;
        slider.value = timeSeriesData.length - 1;
        currentFrameIdx = timeSeriesData.length - 1;

        renderCurrentFrame();
        status.innerText = "Updated successfully.";

      } catch (err) {
        status.innerText = "Fetch error.";
        alert("Error fetching buoy or dynamic metadata: " + err.message);
      }
    }

    function analyzeFrame(frame) {
      const minFreq = 0.05, maxFreq = 0.20;
      const peakThresh = parseFloat(document.getElementById('peakThreshold').value);
      
      const freqs = frame.frequencies;
      const periods = freqs.map(f => 1 / f);
      const E = frame.energy;
      const D1 = frame.alpha1;

      const clusters = [];
      for (let i = 1; i < freqs.length - 1; i++) {
        if (freqs[i] >= minFreq && freqs[i] <= maxFreq) {
          if (E[i] >= E[i-1] && E[i] >= E[i+1] && E[i] >= peakThresh) {
            clusters.push({
              period: periods[i],
              energy: E[i],
              direction: D1[i]
            });
          }
        }
      }
      return clusters.sort((a,b) => b.energy - a.energy).slice(0, 4);
    }

    function getGlobalYMax() {
      const minYLimit = parseFloat(document.getElementById('minYLimit').value) || 2.0;
      let maxEnergy = 0;
      for (let frame of timeSeriesData) {
        const frameMax = Math.max(...frame.energy);
        if (frameMax > maxEnergy) maxEnergy = frameMax;
      }
      return Math.max(minYLimit, maxEnergy * 1.05);
    }

    function renderCurrentFrame() {
      if (!timeSeriesData.length) return;

      const frame = timeSeriesData[currentFrameIdx];
      const currentTimeStr = frame.timestamp; // Eastern Time string
      document.getElementById('timestampDisplay').innerText = currentTimeStr;

      const periods = frame.frequencies.map(f => 1 / f);
      const clusters = analyzeFrame(frame);
      const globalYMax = getGlobalYMax();
      
      const periodLimit = parseFloat(document.getElementById('periodLimit').value) || 18;
      const surfEnergy = parseFloat(document.getElementById('surfEnergy').value) || 1.0;
      const surfPeriod = parseFloat(document.getElementById('surfPeriod').value) || 9;
      const critAngle = parseFloat(document.getElementById('critAngle').value);

      const circleAngles = Array.from({length: 361}, (_, i) => i);
      const circlePeriods = Array(361).fill(surfPeriod);

      // --- 1. Polar Plot ---
      const polarData = [
        {
          type: 'scatterpolar',
          mode: 'markers+text',
          r: clusters.map(c => c.period),
          theta: clusters.map(c => c.direction),
          text: clusters.map((c, i) => `Swell ${i+1}`),
          textposition: 'top right',
          marker: {
            size: clusters.map(c => Math.max(c.energy * 25, 12)),
            color: clusters.map(c => c.energy),
            colorscale: afmhotYellowCap,
            cmin: 0,
            cmax: globalYMax,
            showscale: false
          }
        },
        {
          type: 'scatterpolar',
          mode: 'markers',
          r: clusters.map(c => c.period),
          theta: clusters.map(c => c.direction),
          hoverinfo: 'none',
          marker: {
            size: 4,
            color: 'white'
          }
        },
        {
          type: 'scatterpolar',
          mode: 'lines',
          r: [0, periodLimit],
          theta: [critAngle, critAngle],
          name: 'Crit Angle',
          hoverinfo: 'name',
          line: {
            color: 'green',
            width: 2.5,
            dash: 'solid'
          }
        },
        {
          type: 'scatterpolar',
          mode: 'lines',
          r: circlePeriods,
          theta: circleAngles,
          name: 'Crit Period Circle',
          hoverinfo: 'none',
          line: {
            color: 'green',
            width: 2,
            dash: 'solid'
          }
        }
      ];

      const polarLayout = {
        title: { text: `Peak Swells (Polar)<br><span style="font-size:11px;color:#555">${currentTimeStr}</span>`, font: { size: 13 } },
        polar: {
          angularaxis: { 
            direction: "clockwise", 
            rotation: 90,
            tickmode: 'array',
            tickvals: [0, 45, 90, 135, 180, 225, 270, 315],
            ticktext: ['N', 'NE', 'E', 'SE', 'S', 'SW', 'W', 'NW']
          },
          radialaxis: { 
            range: [0, periodLimit],
            angle: -225,
            tickangle: -225,
            showgrid: false,    /* Hides circumferential grid lines */
            ticks: 'outside',   /* Restores tick marks at 315 NW */
            nticks: 6           /* Limits radial tick text elements */
          }
        },
        showlegend: false,
        margin: { t: 50, b: 20, l: 30, r: 30 },
        autosize: true
      };

      Plotly.newPlot('polarPlot', polarData, polarLayout, plotlyConfig);

      // --- 2. Spectral Density Line Plot ---
      const spectralData = [
        {
          x: periods,
          y: frame.energy,
          type: 'scatter',
          mode: 'lines',
          name: 'Energy Density',
          line: { color: 'blue' }
        }
      ];

      const swellRedLines = clusters.map(c => ({
        type: 'line',
        x0: c.period,
        x1: c.period,
        y0: 0,
        y1: globalYMax,
        line: { color: 'red', width: 2, dash: 'dash' }
      }));

      const spectralLayout = {
        title: { text: `Energy Density vs Period<br><span style="font-size:11px;color:#555">${currentTimeStr}</span>`, font: { size: 13 } },
        xaxis: { title: 'Period (s)', range: [0, periodLimit] },
        yaxis: { title: 'Energy (m²/Hz)', range: [0, globalYMax] },
        margin: { t: 50, b: 40, l: 40, r: 20 },
        shapes: [
          { 
            type: 'line', 
            x0: surfPeriod, 
            x1: surfPeriod, 
            y0: 0, 
            y1: globalYMax, 
            line: { color: 'green', width: 2, dash: 'solid' } 
          },
          { 
            type: 'line', 
            x0: 0, 
            x1: periodLimit, 
            y0: surfEnergy, 
            y1: surfEnergy, 
            line: { color: 'green', width: 2, dash: 'solid' } 
          },
          ...swellRedLines
        ],
        annotations: [
          {
            x: periodLimit,
            y: surfEnergy,
            xref: 'x',
            yref: 'y',
            text: 'Surf-Worthy Swell',
            showarrow: false,
            xanchor: 'right',
            yanchor: 'bottom',
            font: { color: 'green', size: 10, weight: 'bold' }
          }
        ],
        autosize: true
      };

      Plotly.newPlot('spectralPlot', spectralData, spectralLayout, plotlyConfig);

      // --- 3. Heatmap Plot ---
      renderHeatmap(globalYMax, periodLimit, surfPeriod, currentTimeStr);
    }

    function renderHeatmap(globalYMax, periodLimit, surfPeriod, currentTimeStr) {
      const zValues = [];
      const yValues = timeSeriesData[0].frequencies.map(f => 1 / f);
      const xValues = timeSeriesData.map((_, idx) => `Hr ${idx}`);

      for (let j = 0; j < yValues.length; j++) {
        const row = [];
        for (let i = 0; i < timeSeriesData.length; i++) {
          row.push(timeSeriesData[i].energy[j]);
        }
        zValues.push(row);
      }

      const heatmapData = [{
        z: zValues,
        x: xValues,
        y: yValues,
        type: 'heatmap',
        colorscale: afmhotYellowCap,
        zmin: 0,
        zmax: globalYMax || 2.0
      }];

      const heatmapLayout = {
        title: { text: `Spectral Density Heatmap Over Time<br><span style="font-size:11px;color:#555">Active Frame: ${currentTimeStr}</span>`, font: { size: 13 } },
        xaxis: { title: 'Timeline Index' },
        yaxis: { title: 'Period (s)', range: [0, periodLimit] },
        margin: { t: 50, b: 40, l: 40, r: 20 },
        autosize: true,
        shapes: [
          {
            type: 'line',
            xref: 'x',
            yref: 'paper',
            x0: `Hr ${currentFrameIdx}`,
            x1: `Hr ${currentFrameIdx}`,
            y0: 0,
            y1: 1,
            line: {
              color: 'white',
              width: 3
            }
          },
          {
            type: 'line',
            xref: 'paper',
            yref: 'y',
            x0: 0,
            x1: 1,
            y0: surfPeriod,
            y1: surfPeriod,
            line: {
              color: 'green',
              width: 2,
              dash: 'solid'
            }
          }
        ]
      };

      Plotly.newPlot('heatmapPlot', heatmapData, heatmapLayout, plotlyConfig);
    }

    function togglePlay() {
      if (isPlaying) {
        pause();
      } else {
        play();
      }
    }

    function play() {
      isPlaying = true;
      document.getElementById('playBtn').innerText = "⏸ Pause";
      playInterval = setInterval(() => {
        if (currentFrameIdx >= timeSeriesData.length - 1) {
          currentFrameIdx = 0;
        } else {
          currentFrameIdx++;
        }
        document.getElementById('timeSlider').value = currentFrameIdx;
        renderCurrentFrame();
      }, 1000);
    }

    function pause() {
      isPlaying = false;
      document.getElementById('playBtn').innerText = "▶ Play";
      if (playInterval) clearInterval(playInterval);
    }

    function stepFrame(dir) {
      pause();
      currentFrameIdx = Math.max(0, Math.min(timeSeriesData.length - 1, currentFrameIdx + dir));
      document.getElementById('timeSlider').value = currentFrameIdx;
      renderCurrentFrame();
    }

    function firstFrame() {
      pause();
      currentFrameIdx = 0;
      document.getElementById('timeSlider').value = currentFrameIdx;
      renderCurrentFrame();
    }

    function lastFrame() {
      pause();
      currentFrameIdx = timeSeriesData.length - 1;
      document.getElementById('timeSlider').value = currentFrameIdx;
      renderCurrentFrame();
    }

    function onSliderMove(val) {
      pause();
      currentFrameIdx = parseInt(val);
      renderCurrentFrame();
    }

    window.onload = () => {
      setDefaultStartDate();
      fetchAndProcessData();
    };
  </script>
</body>
</html>
