<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wave Dash - Live Interactive Spectral Analysis</title>
  
  <!-- Leaflet CSS & JS for Interactive Map (with cdnjs fallback if unpkg is blocked/unreachable) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    if (typeof L === 'undefined') {
      document.write('<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">');
      document.write('<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"><\/script>');
    }
  </script>

  <!-- Plotly.js for Dynamic Vector Charts (with jsdelivr fallback if cdn.plot.ly is blocked/unreachable) -->
  <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
  <script>
    if (typeof Plotly === 'undefined') {
      document.write('<script src="https://cdn.jsdelivr.net/npm/plotly.js-dist-min@2.27.0/plotly.min.js"><\/script>');
    }
  </script>

  <style>
    html, body {
      height: 100%;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }
    body { 
      font-family: Arial, sans-serif; 
      margin: 0; 
      padding: 10px; 
      background: #f4f6f8; 
      box-sizing: border-box;
    }
    h2 { 
      margin-top: 0; 
      color: #1a252f; 
      font-size: 1.3rem; 
      text-align: center;
    }
    
    .grid-container { 
      display: flex; 
      flex-direction: column; 
      gap: 15px; 
      padding-bottom: 20px;
    }
    .panel { 
      background: white; 
      padding: 12px; 
      border-radius: 8px; 
      box-shadow: 0 2px 5px rgba(0,0,0,0.1); 
    }

    .map-controls-row {
      display: flex;
      flex-direction: row;
      gap: 12px;
      align-items: stretch;
    }

    .map-col {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .controls-col {
      flex: 1.2;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-width: 0;
    }

    .params-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px 10px;
    }

    .span-full {
      grid-column: span 2;
    }

    #map { 
      height: 100%; 
      min-height: 250px;
      width: 100%; 
      border-radius: 6px; 
    }

    .control-group { 
      margin-bottom: 2px; 
    }
    .control-group label { 
      display: block; 
      font-size: 10px; 
      font-weight: bold; 
      margin-bottom: 2px; 
      white-space: nowrap;
    }
    .control-group input, .control-group select { 
      width: 100%; 
      padding: 4px 6px; 
      box-sizing: border-box; 
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 11px;
    }

    .btn { 
      background: #007bff; 
      color: white; 
      border: none; 
      padding: 8px 10px; 
      border-radius: 4px; 
      cursor: pointer; 
      width: 100%; 
      margin-top: 6px;
      font-weight: bold;
      font-size: 12px;
    }
    .btn:hover { background: #0056b3; }
    .status-msg { font-size: 10px; color: #6c757d; margin-top: 4px; font-style: italic; text-align: center; }
    
    .player-controls { 
      display: flex; 
      gap: 4px; 
      align-items: center; 
      justify-content: space-between; 
      margin-bottom: 10px; 
    }
    .player-btn { 
      flex: 1;
      padding: 8px 4px; 
      font-weight: bold; 
      font-size: 12px;
      cursor: pointer; 
      background: #e9ecef; 
      border: 1px solid #ced4da; 
      border-radius: 4px; 
    }
    .player-btn:hover { background: #dee2e6; }
    .slider-container { display: flex; flex-direction: column; gap: 5px; margin-top: 5px; }
    .slider-container input { width: 100%; }

    .plots-grid { 
      display: flex; 
      flex-direction: column; 
      gap: 20px; 
    }
    .plot-box { 
      height: 270px; 
      width: 100%;
    }

    @media (min-width: 768px) {
      body { padding: 15px; }
      h2 { font-size: 1.5rem; text-align: left; }
      .plots-grid { 
        display: grid; 
        grid-template-columns: 1fr 1fr; 
      }
      .full-width { grid-column: span 2; }
      .plot-box { height: 320px; }
      .slider-container { flex-direction: row; align-items: center; }
    }
  </style>
</head>
<body>

  <h2>🌊 Wave Dash - Ocean Wave Spectral Dashboard</h2>

  <div class="grid-container">
    <div class="panel">
      <div class="map-controls-row">
        
        <div class="map-col">
          <label style="font-size: 12px; font-weight: bold; margin-bottom: 4px;">Select Wave Buoy:</label>
          <div id="map"></div>
        </div>

        <div class="controls-col">
          <div class="params-grid">
            
            <div class="control-group span-full">
              <label>Station ID:</label>
              <input type="text" id="stationId" value="41159">
            </div>

            <div class="control-group span-full">
              <label>Start Date & Time (EST/EDT):</label>
              <input type="datetime-local" id="startDate">
            </div>
            
            <div class="control-group">
              <label>Hours to Plot:</label>
              <input type="number" id="hoursToPlot" value="12" min="1" max="24">
            </div>

            <div class="control-group">
              <label>Period Limit (s):</label>
              <input type="number" id="periodLimit" value="18" min="5" max="30">
            </div>

            <div class="control-group">
              <label>Min Y-Limit (Energy):</label>
              <input type="number" step="0.1" id="minYLimit" value="2.0" min="0.1">
            </div>

            <div class="control-group">
              <label>Surf Swell Energy:</label>
              <input type="number" step="0.1" id="surfEnergy" value="1.0">
            </div>

            <div class="control-group">
              <label>Surf Swell Period (s):</label>
              <input type="number" id="surfPeriod" value="9">
            </div>

            <div class="control-group">
              <label>Crit Angle (°):</label>
              <input type="number" id="critAngle" value="120">
            </div>

            <div class="control-group span-full">
              <label>Peak Thresh (m²/Hz):</label>
              <input type="number" step="0.05" id="peakThreshold" value="0.1">
            </div>

          </div>

          <button class="btn" id="fetchBtn" onclick="fetchAndProcessData()">Update</button>
          <div id="statusMsg" class="status-msg">Ready.</div>
        </div>

      </div>
    </div>

    <div class="panel">
      <div class="player-controls">
        <button class="player-btn" onclick="firstFrame()">⏮ First</button>
        <button class="player-btn" onclick="stepFrame(-1)">◀ Rev</button>
        <button class="player-btn" id="playBtn" onclick="togglePlay()">▶ Play</button>
        <button class="player-btn" onclick="stepFrame(1)">Next ▶</button>
        <button class="player-btn" onclick="lastFrame()">Last ⏭</button>
      </div>

      <div class="slider-container">
        <span id="timestampDisplay" style="font-weight: bold; text-align: center;">Loading...</span>
        <input type="range" id="timeSlider" min="0" max="0" value="0" oninput="onSliderMove(this.value)">
      </div>

      <div class="plots-grid" style="margin-top: 15px;">
        <div id="polarPlot" class="plot-box"></div>
        <div id="spectralPlot" class="plot-box"></div>
        <div id="heatmapPlot" class="plot-box full-width"></div>
      </div>
    </div>
  </div>

  <script>
    /* =====================================================================
       CONFIGURATION & CONSTANTS
       Central place for values that used to be duplicated or hardcoded
       ("magic numbers") in multiple functions throughout the file.
       ===================================================================== */
    const WORKER_URL = "https://noaa-wave-proxy.rwnster.workers.dev";
    const EARTH_RADIUS_MILES = 3958.8;
    const MILES_TO_METERS = 1609.34;
    const NEARBY_BUOY_RADIUS_MILES = 200;
    const PLAYBACK_INTERVAL_MS = 1000;
    const MAX_SWELL_CLUSTERS = 4;
    const PEAK_DETECT_MIN_FREQ_HZ = 0.05;
    const PEAK_DETECT_MAX_FREQ_HZ = 0.20;

    // Fallback values used only if a control's field is emptied/invalid.
    // These intentionally mirror the value="..." defaults on the matching
    // <input> elements above, so keep them in sync if those ever change.
    const DEFAULTS = {
      periodLimit: 18,
      minYLimit: 2.0,
      surfEnergy: 1.0,
      surfPeriod: 9
    };

    const afmhotYellowCap = [
      [0.0, '#000000'],
      [0.25, '#660000'],
      [0.5, '#CC3300'],
      [0.75, '#FF6600'],
      [1.0, '#FFFF80']
    ];

    const plotlyConfig = {
      displayModeBar: false,
      scrollZoom: false,
      responsive: true
    };

    // Reused Plotly line styles (previously the same object literal was
    // repeated inline 4-5 times across the polar/spectral/heatmap layouts).
    const SURF_GUIDE_LINE_STYLE = { color: 'green', width: 2, dash: 'solid' };
    const CRIT_ANGLE_LINE_STYLE = { color: 'green', width: 2.5, dash: 'solid' };
    const SWELL_MARKER_LINE_STYLE = { color: 'red', width: 2, dash: 'dash' };

    /* =====================================================================
       STATE
       ===================================================================== */
    let timeSeriesData = [];
    let currentFrameIdx = 0;
    let isPlaying = false;
    let playInterval = null;
    let mapMarkersGroup = null;

    // Local static fallback database for common wave buoys (used only if
    // the live NOAA activestations.xml fetch fails or times out).
    const fallbackBuoyDatabase = [
      { id: "41159", name: "41159 - Onslow Bay Outer, NC", lat: 34.211, lon: -76.944 },
      { id: "41013", name: "41013 - Frying Pan Shoals, NC", lat: 33.436, lon: -77.743 },
      { id: "41036", name: "41036 - Onslow Bay Inner, NC", lat: 34.207, lon: -76.949 },
      { id: "41002", name: "41002 - South Hatteras, NC", lat: 31.759, lon: -74.936 },
      { id: "41004", name: "41004 - Edisto, SC", lat: 32.502, lon: -79.099 },
      { id: "41008", name: "41008 - Grays Reef, GA", lat: 31.400, lon: -80.866 },
      { id: "41009", name: "41009 - Canaveral 20 NM East, FL", lat: 28.526, lon: -80.188 },
      { id: "41010", name: "41010 - Canaveral 120 NM East, FL", lat: 28.878, lon: -78.485 },
      { id: "44014", name: "44014 - Virginia Beach, VA", lat: 36.611, lon: -74.836 },
      { id: "44025", name: "44025 - Long Island, NY", lat: 40.251, lon: -73.164 }
    ];

    /* =====================================================================
       CONTROL PANEL HELPERS
       One place that reads every control-panel input, instead of each
       function independently calling document.getElementById(...).value.
       ===================================================================== */
    function getUserSettings() {
      return {
        stationId: document.getElementById('stationId').value.trim(),
        hoursToPlot: parseInt(document.getElementById('hoursToPlot').value),
        startDate: document.getElementById('startDate').value,
        periodLimit: parseFloat(document.getElementById('periodLimit').value) || DEFAULTS.periodLimit,
        minYLimit: parseFloat(document.getElementById('minYLimit').value) || DEFAULTS.minYLimit,
        surfEnergy: parseFloat(document.getElementById('surfEnergy').value) || DEFAULTS.surfEnergy,
        surfPeriod: parseFloat(document.getElementById('surfPeriod').value) || DEFAULTS.surfPeriod,
        critAngle: parseFloat(document.getElementById('critAngle').value),
        peakThreshold: parseFloat(document.getElementById('peakThreshold').value)
      };
    }

    function buildProxyUrl(targetUrl) {
      return `${WORKER_URL}?url=${encodeURIComponent(targetUrl)}`;
    }

    /* =====================================================================
       DATE / TIME HELPERS
       ===================================================================== */
    function getETDateParts(dateObj, options) {
      const formatter = new Intl.DateTimeFormat('en-US', { timeZone: 'America/New_York', ...options });
      const parts = {};
      formatter.formatToParts(dateObj).forEach(p => {
        if (p.type !== 'literal') parts[p.type] = p.value;
      });
      return parts;
    }

    function formatToET(dateObj) {
      const p = getETDateParts(dateObj, {
        year: 'numeric', month: '2-digit', day: '2-digit',
        hour: '2-digit', minute: '2-digit', hour12: false, timeZoneName: 'short'
      });
      return `${p.year}-${p.month}-${p.day} ${p.hour}:${p.minute} ${p.timeZoneName}`;
    }

    function setDefaultStartDate() {
      const p = getETDateParts(new Date(), {
        year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', hour12: false
      });
      document.getElementById('startDate').value = `${p.year}-${p.month}-${p.day}T${p.hour}:00`;
    }

    /* =====================================================================
       MAP INITIALIZATION
       ===================================================================== */
    let map = null;
    if (typeof L === 'undefined') {
      document.getElementById('map').innerHTML =
        '<div style="display:flex;align-items:center;justify-content:center;height:100%;padding:10px;text-align:center;color:#d9534f;font-size:12px;">Map library failed to load (check network/ad-blocker for unpkg.com and cdnjs.cloudflare.com), then reload the page.</div>';
      document.getElementById('statusMsg').innerText = 'Map library failed to load. Data fetching still works.';
    } else {
      map = L.map('map').setView([34.211, -76.944], 7);

      L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Ocean/World_Ocean_Base/MapServer/tile/{z}/{y}/{x}', {
        attribution: 'Tiles &copy; Esri &mdash; Sources: GEBCO, NOAA, CHS, GEOBASS, GAA',
        maxZoom: 13
      }).addTo(map);

      L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Ocean/World_Ocean_Reference/MapServer/tile/{z}/{y}/{x}', {
        maxZoom: 13
      }).addTo(map);

      mapMarkersGroup = L.layerGroup().addTo(map);
    }

    function getDistanceMiles(lat1, lon1, lat2, lon2) {
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                Math.sin(dLon / 2) * Math.sin(dLon / 2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
      return EARTH_RADIUS_MILES * c;
    }

    function renderBuoysOnMap(buoyList, targetBuoy) {
      if (!map || !mapMarkersGroup) return;
      mapMarkersGroup.clearLayers();

      const nearbyBuoys = buoyList.filter(b =>
        getDistanceMiles(targetBuoy.lat, targetBuoy.lon, b.lat, b.lon) <= NEARBY_BUOY_RADIUS_MILES
      );

      nearbyBuoys.forEach(b => {
        const dist = getDistanceMiles(targetBuoy.lat, targetBuoy.lon, b.lat, b.lon);
        const isTarget = (b.id.toUpperCase() === targetBuoy.id.toUpperCase());

        const marker = L.circleMarker([b.lat, b.lon], {
          radius: isTarget ? 8 : 6,
          color: isTarget ? '#d9534f' : '#007bff',
          fillColor: isTarget ? '#ff4d4d' : '#3399ff',
          fillOpacity: 0.9,
          weight: 2
        }).addTo(mapMarkersGroup);

        marker.bindPopup(`<b>Station ${b.id}</b><br>${b.name}<br>Distance: ${dist.toFixed(1)} miles`);
        marker.on('click', () => {
          document.getElementById('stationId').value = b.id;
          fetchAndProcessData();
        });
      });

      L.circle([targetBuoy.lat, targetBuoy.lon], {
        radius: NEARBY_BUOY_RADIUS_MILES * MILES_TO_METERS,
        color: '#007bff',
        fillColor: '#007bff',
        fillOpacity: 0.08,
        weight: 1.5
      }).addTo(mapMarkersGroup);

      map.setView([targetBuoy.lat, targetBuoy.lon], 7);
    }

    /* =====================================================================
       NOAA DATA FETCHING
       ===================================================================== */
    async function updateDynamicBuoyDatabase(activeStationId) {
      const targetUrl = "https://www.ndbc.noaa.gov/activestations.xml";

      try {
        const response = await fetch(buildProxyUrl(targetUrl));
        if (!response.ok) throw new Error("Could not fetch active NOAA stations database.");

        const xmlText = await response.text();
        const parser = new DOMParser();
        const xmlDoc = parser.parseFromString(xmlText, "text/xml");
        const stationNodes = xmlDoc.getElementsByTagName("station");

        const allStations = [];
        let targetBuoy = null;

        for (let i = 0; i < stationNodes.length; i++) {
          const node = stationNodes[i];
          const id = node.getAttribute("id") ? node.getAttribute("id").toUpperCase() : "";
          const lat = parseFloat(node.getAttribute("lat"));
          const lon = parseFloat(node.getAttribute("lon"));
          const name = node.getAttribute("name") || `Station ${id}`;
          // NOTE: NOAA's activestations.xml has no "has spectral wave data"
          // attribute (real attrs are id/lat/lon/elev/name/owner/met/
          // currents/waterquality/dart). We can't reliably filter to
          // wave-only buoys from this file, so we show every nearby station
          // with valid coordinates and track "met" only as a rough proxy
          // for "this station is actively reporting something".
          const metActive = (node.getAttribute("met") || "").toLowerCase() === "y";

          if (!isNaN(lat) && !isNaN(lon)) {
            const stationObj = { id, name: `${id} - ${name}`, lat, lon, metActive };
            allStations.push(stationObj);
            if (id === activeStationId.toUpperCase()) targetBuoy = stationObj;
          }
        }

        if (!targetBuoy) throw new Error("Target buoy not found in active XML list.");
        renderBuoysOnMap(allStations, targetBuoy);

      } catch (err) {
        console.warn("Using fallback local database for markers:", err);
        const searchId = activeStationId.toUpperCase();
        const targetBuoy = fallbackBuoyDatabase.find(b => b.id === searchId) ||
          { id: searchId, name: `Station ${searchId}`, lat: 34.211, lon: -76.944 };

        renderBuoysOnMap(fallbackBuoyDatabase, targetBuoy);
      }
    }

    async function fetchNDBCFile(stationId, ext) {
      const targetUrl = `https://www.ndbc.noaa.gov/data/realtime2/${stationId}.${ext}`;
      const response = await fetch(buildProxyUrl(targetUrl));

      if (!response.ok) {
        throw new Error(`HTTP ${response.status} from Cloudflare worker while fetching .${ext}`);
      }

      const text = await response.text();
      if (!text || text.trim().length === 0 || text.includes("403 Forbidden")) {
        throw new Error(`Invalid data payload received for .${ext}`);
      }

      return parseNDBCFormat(text);
    }

    function parseNDBCFormat(text) {
      const lines = text.trim().split('\n');
      const timestamps = [];
      let frequencies = [];
      const matrices = [];

      for (let line of lines) {
        line = line.trim();
        if (line.startsWith('#') || !line) continue;

        const parts = line.split(/\s+/);
        if (parts.length < 6) continue;

        const matches = [...line.matchAll(/([-+]?\d+(?:\.\d+)?)\s+\(([-+]?\d+(?:\.\d+)?)\)/g)];
        if (matches.length === 0) continue;

        if (frequencies.length === 0) {
          frequencies = matches.map(m => parseFloat(m[2]));
        }

        const utcDate = new Date(Date.UTC(parts[0], parts[1] - 1, parts[2], parts[3], parts[4]));
        timestamps.push(formatToET(utcDate));
        matrices.push(matches.map(m => parseFloat(m[1])));
      }
      return { timestamps, frequencies, matrices };
    }

    async function fetchAndProcessData() {
      pause();
      const status = document.getElementById('statusMsg');
      const settings = getUserSettings();

      try {
        status.innerText = `Locating nearby wave buoys within ${NEARBY_BUOY_RADIUS_MILES}mi...`;
        await updateDynamicBuoyDatabase(settings.stationId);

        status.innerText = "Fetching buoy data via worker...";
        const [spec, alpha1, alpha2] = await Promise.all([
          fetchNDBCFile(settings.stationId, 'data_spec'),
          fetchNDBCFile(settings.stationId, 'swdir'),
          fetchNDBCFile(settings.stationId, 'swdir2')
        ]);

        status.innerText = "Processing spectral matrices...";

        let startIndex = 0;
        if (settings.startDate) {
          const targetTime = new Date(settings.startDate).getTime();
          const foundIdx = spec.timestamps.findIndex(ts => new Date(ts).getTime() <= targetTime);
          startIndex = foundIdx === -1 ? 0 : foundIdx;
        }

        const endIndex = Math.min(startIndex + settings.hoursToPlot, spec.timestamps.length);
        timeSeriesData = [];

        for (let i = endIndex - 1; i >= startIndex; i--) {
          timeSeriesData.push({
            timestamp: spec.timestamps[i],
            frequencies: spec.frequencies,
            energy: spec.matrices[i],
            alpha1: alpha1.matrices[i],
            alpha2: alpha2.matrices[i]
          });
        }

        if (timeSeriesData.length === 0) {
          throw new Error("No data found for the selected start date.");
        }

        const slider = document.getElementById('timeSlider');
        slider.max = timeSeriesData.length - 1;
        slider.value = timeSeriesData.length - 1;
        currentFrameIdx = timeSeriesData.length - 1;

        renderCurrentFrame();
        status.innerText = "Updated successfully.";

      } catch (err) {
        status.innerText = "Fetch error.";
        alert("Error fetching buoy or dynamic metadata: " + err.message);
      }
    }

    /* =====================================================================
       SPECTRAL ANALYSIS
       ===================================================================== */
    function analyzeFrame(frame, peakThreshold) {
      const freqs = frame.frequencies;
      const periods = freqs.map(f => 1 / f);
      const energyValues = frame.energy;
      const directionValues = frame.alpha1;

      const clusters = [];
      for (let i = 1; i < freqs.length - 1; i++) {
        if (freqs[i] < PEAK_DETECT_MIN_FREQ_HZ || freqs[i] > PEAK_DETECT_MAX_FREQ_HZ) continue;
        const isLocalPeak = energyValues[i] >= energyValues[i - 1] && energyValues[i] >= energyValues[i + 1];
        if (isLocalPeak && energyValues[i] >= peakThreshold) {
          clusters.push({
            period: periods[i],
            energy: energyValues[i],
            direction: directionValues[i]
          });
        }
      }
      return clusters.sort((a, b) => b.energy - a.energy).slice(0, MAX_SWELL_CLUSTERS);
    }

    function getGlobalYMax(minYLimit) {
      let maxEnergy = 0;
      for (const frame of timeSeriesData) {
        const frameMax = Math.max(...frame.energy);
        if (frameMax > maxEnergy) maxEnergy = frameMax;
      }
      return Math.max(minYLimit, maxEnergy * 1.05);
    }

    /* =====================================================================
       CHART RENDERING
       ===================================================================== */
    function renderCurrentFrame() {
      if (!timeSeriesData.length) return;

      const settings = getUserSettings();
      const frame = timeSeriesData[currentFrameIdx];
      const currentTimeStr = frame.timestamp;
      document.getElementById('timestampDisplay').innerText = currentTimeStr;

      const periods = frame.frequencies.map(f => 1 / f);
      const clusters = analyzeFrame(frame, settings.peakThreshold);
      const globalYMax = getGlobalYMax(settings.minYLimit);
      const { periodLimit, surfEnergy, surfPeriod, critAngle } = settings;

      const circleAngles = Array.from({ length: 361 }, (_, i) => i);
      const circlePeriods = Array(361).fill(surfPeriod);

      const polarData = [
        {
          type: 'scatterpolar',
          mode: 'markers+text',
          r: clusters.map(c => c.period),
          theta: clusters.map(c => c.direction),
          text: clusters.map((c, i) => `Swell ${i + 1}`),
          textposition: 'top right',
          marker: {
            size: clusters.map(c => Math.max(c.energy * 25, 12)),
            color: clusters.map(c => c.energy),
            colorscale: afmhotYellowCap,
            cmin: 0,
            cmax: globalYMax,
            showscale: false
          }
        },
        {
          type: 'scatterpolar',
          mode: 'markers',
          r: clusters.map(c => c.period),
          theta: clusters.map(c => c.direction),
          hoverinfo: 'none',
          marker: { size: 4, color: 'white' }
        },
        {
          type: 'scatterpolar',
          mode: 'lines',
          r: [0, periodLimit],
          theta: [critAngle, critAngle],
          name: 'Crit Angle',
          hoverinfo: 'name',
          line: CRIT_ANGLE_LINE_STYLE
        },
        {
          type: 'scatterpolar',
          mode: 'lines',
          r: circlePeriods,
          theta: circleAngles,
          name: 'Crit Period Circle',
          hoverinfo: 'none',
          line: SURF_GUIDE_LINE_STYLE
        }
      ];

      const polarLayout = {
        title: { text: `Peak Swells (Polar)<br><span style="font-size:11px;color:#555">${currentTimeStr}</span>`, font: { size: 13 } },
        polar: {
          angularaxis: {
            direction: "clockwise",
            rotation: 90,
            tickmode: 'array',
            tickvals: [0, 45, 90, 135, 180, 225, 270, 315],
            ticktext: ['N', 'NE', 'E', 'SE', 'S', 'SW', 'W', 'NW']
          },
          radialaxis: {
            range: [0, periodLimit],
            angle: -225,
            tickangle: -225,
            showgrid: false,
            ticks: 'outside',
            nticks: 6
          }
        },
        showlegend: false,
        margin: { t: 50, b: 20, l: 30, r: 30 },
        autosize: true
      };

      Plotly.newPlot('polarPlot', polarData, polarLayout, plotlyConfig);

      const spectralData = [
        {
          x: periods,
          y: frame.energy,
          type: 'scatter',
          mode: 'lines',
          name: 'Energy Density',
          line: { color: 'blue' }
        }
      ];

      const swellRedLines = clusters.map(c => ({
        type: 'line',
        x0: c.period,
        x1: c.period,
        y0: 0,
        y1: globalYMax,
        line: SWELL_MARKER_LINE_STYLE
      }));

      const spectralLayout = {
        title: { text: `Energy Density vs Period<br><span style="font-size:11px;color:#555">${currentTimeStr}</span>`, font: { size: 13 } },
        xaxis: { title: 'Period (s)', range: [0, periodLimit] },
        yaxis: { title: 'Energy (m²/Hz)', range: [0, globalYMax] },
        margin: { t: 50, b: 40, l: 40, r: 20 },
        shapes: [
          { type: 'line', x0: surfPeriod, x1: surfPeriod, y0: 0, y1: globalYMax, line: SURF_GUIDE_LINE_STYLE },
          { type: 'line', x0: 0, x1: periodLimit, y0: surfEnergy, y1: surfEnergy, line: SURF_GUIDE_LINE_STYLE },
          ...swellRedLines
        ],
        annotations: [
          {
            x: periodLimit,
            y: surfEnergy,
            xref: 'x',
            yref: 'y',
            text: 'Surf-Worthy Swell',
            showarrow: false,
            xanchor: 'right',
            yanchor: 'bottom',
            font: { color: 'green', size: 10, weight: 'bold' }
          }
        ],
        autosize: true
      };

      Plotly.newPlot('spectralPlot', spectralData, spectralLayout, plotlyConfig);

      renderHeatmap({ globalYMax, periodLimit, surfPeriod, currentTimeStr });
    }

    function renderHeatmap({ globalYMax, periodLimit, surfPeriod, currentTimeStr }) {
      const yValues = timeSeriesData[0].frequencies.map(f => 1 / f);
      const xValues = timeSeriesData.map((_, idx) => `Hr ${idx}`);
      const zValues = yValues.map((_, j) => timeSeriesData.map(frame => frame.energy[j]));

      const heatmapData = [{
        z: zValues,
        x: xValues,
        y: yValues,
        type: 'heatmap',
        colorscale: afmhotYellowCap,
        zmin: 0,
        zmax: globalYMax || DEFAULTS.minYLimit
      }];

      const heatmapLayout = {
        title: { text: `Spectral Density Heatmap Over Time<br><span style="font-size:11px;color:#555">Active Frame: ${currentTimeStr}</span>`, font: { size: 13 } },
        xaxis: { title: 'Timeline Index' },
        yaxis: { title: 'Period (s)', range: [0, periodLimit] },
        margin: { t: 50, b: 40, l: 40, r: 20 },
        autosize: true,
        shapes: [
          {
            type: 'line', xref: 'x', yref: 'paper',
            x0: `Hr ${currentFrameIdx}`, x1: `Hr ${currentFrameIdx}`, y0: 0, y1: 1,
            line: { color: 'white', width: 3 }
          },
          {
            type: 'line', xref: 'paper', yref: 'y',
            x0: 0, x1: 1, y0: surfPeriod, y1: surfPeriod,
            line: SURF_GUIDE_LINE_STYLE
          }
        ]
      };

      Plotly.newPlot('heatmapPlot', heatmapData, heatmapLayout, plotlyConfig);
    }

    /* =====================================================================
       PLAYBACK CONTROLS
       ===================================================================== */
    function togglePlay() {
      isPlaying ? pause() : play();
    }

    function play() {
      isPlaying = true;
      document.getElementById('playBtn').innerText = "⏸ Pause";
      playInterval = setInterval(() => {
        currentFrameIdx = (currentFrameIdx >= timeSeriesData.length - 1) ? 0 : currentFrameIdx + 1;
        document.getElementById('timeSlider').value = currentFrameIdx;
        renderCurrentFrame();
      }, PLAYBACK_INTERVAL_MS);
    }

    function pause() {
      isPlaying = false;
      document.getElementById('playBtn').innerText = "▶ Play";
      if (playInterval) clearInterval(playInterval);
    }

    function stepFrame(dir) {
      pause();
      currentFrameIdx = Math.max(0, Math.min(timeSeriesData.length - 1, currentFrameIdx + dir));
      document.getElementById('timeSlider').value = currentFrameIdx;
      renderCurrentFrame();
    }

    function firstFrame() {
      pause();
      currentFrameIdx = 0;
      document.getElementById('timeSlider').value = currentFrameIdx;
      renderCurrentFrame();
    }

    function lastFrame() {
      pause();
      currentFrameIdx = timeSeriesData.length - 1;
      document.getElementById('timeSlider').value = currentFrameIdx;
      renderCurrentFrame();
    }

    function onSliderMove(val) {
      pause();
      currentFrameIdx = parseInt(val);
      renderCurrentFrame();
    }

    /* =====================================================================
       INIT
       ===================================================================== */
    window.onload = () => {
      setDefaultStartDate();
      fetchAndProcessData();
    };
  </script>
</body>
</html>
