<!--
  Wave Dash
  =========
  Single-file surf-forecasting dashboard for NDBC wave buoys. Pulls live
  spectral wave data (energy density vs. frequency), wind, and tide
  predictions from NOAA (via a Cloudflare Worker CORS proxy) for a chosen
  buoy/date range, then renders:
    - a collapsible swell table (height, period, direction, face height,
      energy — always 4 rows, padded with placeholders below the detected
      count) with wind grade/Effective Wind/direction and overall
      significant wave height in its own header bar,
    - a polar plot of ranked swells (period + direction) and the wind arrow,
    - an energy-density-vs-period spectral plot for the current frame,
    - and an hours-long heatmap of the spectrum over time, with an optional
      tide overlay.

  Per-swell significant wave height is derived by band-integrating the
  *measured* spectrum around each detected peak (Hs = 4*sqrt(m0)) — no
  Pierson-Moskowitz/JONSWAP shape is assumed; see computeSwellBandM0().
  Face height is an empirical beach-break estimate for a ~1:30 slope; see
  estimateFaceHeightM().

  Versioning: MAJOR.MINOR.PATCH (current version: see APP_VERSION below,
  also shown next to the title). MAJOR = major/breaking changes, MINOR =
  added functionality, PATCH = tweaks. Bumped only at explicit "ready to
  push" points, not on every edit.

  Changelog (brief — full history in claude/CHANGELOG.md, same project):
    v2.0.0 (2026-09-21) — Swell table reworked: reordered to Height/Period/
      Direction/Face/Energy with a new Direction column; unit labels wrap
      to a second line and columns are fixed-width so it never scrolls or
      stretches; always renders all 4 rows (muted placeholders below the
      detected count) so the plots below it don't jump between frames;
      moved to sit above the polar/spectral plots; rank swatch is now a
      colored bubble under the row number, matching the polar plot's
      markers. Removed the standalone wind/swell legend bar — wind grade,
      Effective Wind, wind direction (compass label), and overall
      significant wave height (Hs, computed from the full spectrum) now
      live in the swell table's own header bar instead. Heatmap Period
      axis floored at 2s (was 0s) so the tide overlay line no longer
      crosses blank space below the buoy's real data.
    v1.0.0 (2026-09-18) — Baseline release: NDBC buoy/wind/tide data with
      hourly playback; polar, spectral, and heatmap views; swell peak
      detection & ranking; band-integrated per-swell height (ft) and
      beach-break face height; collapsible swell table; popups showing
      height alongside energy/period; minor cleanup (removed dead code,
      de-duplicated swell color/hover-text helpers).
-->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wave Dash</title>

  <!-- Leaflet CSS & JS for Interactive Map -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    if (typeof L === 'undefined') {
      document.write('<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">');
      document.write('<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"><\/script>');
    }
  </script>

  <!-- Plotly.js for Dynamic Vector Charts -->
  <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
  <script>
    if (typeof Plotly === 'undefined') {
      document.write('<script src="https://cdn.jsdelivr.net/npm/plotly.js-dist-min@2.27.0/plotly.min.js"><\/script>');
    }
  </script>

  <style>
    html, body {
      height: 100%;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 10px;
      background: #f4f6f8;
      box-sizing: border-box;
    }
    h2 {
      margin-top: 0;
      color: #1a252f;
      font-size: 1.3rem;
      text-align: center;
    }
    .version-badge {
      font-size: 0.5em;
      font-weight: normal;
      color: #8a97a3;
      vertical-align: middle;
      margin-left: 6px;
    }

    .grid-container {
      display: flex;
      flex-direction: column;
      gap: 15px;
      padding-bottom: 20px;
    }
    .panel {
      background: white;
      padding: 12px;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }

    .map-controls-row {
      display: flex;
      flex-direction: row;
      gap: 12px;
      align-items: stretch;
    }

    .map-col {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .controls-col {
      flex: 1.2;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-width: 0;
    }

    .params-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px 10px;
    }

    .span-full {
      grid-column: span 2;
    }

    #map {
      height: 100%;
      min-height: 250px;
      width: 100%;
      border-radius: 6px;
    }

    .control-group {
      margin-bottom: 2px;
    }
    .control-group label {
      display: block;
      font-size: 10px;
      font-weight: bold;
      margin-bottom: 2px;
      white-space: nowrap;
    }
    .control-group input, .control-group select {
      width: 100%;
      padding: 4px 6px;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 11px;
    }
    .beach-angle-preset {
      margin-top: 3px;
      cursor: pointer;
    }

    .btn {
      background: #007bff;
      color: white;
      border: none;
      padding: 8px 10px;
      border-radius: 4px;
      cursor: pointer;
      width: 100%;
      margin-top: 6px;
      font-weight: bold;
      font-size: 12px;
    }
    .btn:hover { background: #0056b3; }
    .status-msg { font-size: 10px; color: #6c757d; margin-top: 4px; font-style: italic; text-align: center; }

    .player-controls {
      display: flex;
      gap: 4px;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }
    .player-btn {
      flex: 1;
      padding: 8px 4px;
      font-weight: bold;
      font-size: 12px;
      cursor: pointer;
      background: #e9ecef;
      border: 1px solid #ced4da;
      border-radius: 4px;
    }
    .player-btn:hover { background: #dee2e6; }

    .speed-select {
      padding: 7px 4px;
      border-radius: 4px;
      border: 1px solid #ced4da;
      font-weight: bold;
      font-size: 11px;
      cursor: pointer;
      background: #fff;
    }

    .slider-container { display: flex; flex-direction: column; gap: 5px; margin-top: 5px; }
    .slider-container input { width: 100%; }

    /* Rank bubble — a small circle under the row number in the swell table's
       "#" column, colored to match that swell's marker on the polar plot
       (see swellRankColor()). Round rather than the old square swatch so it
       reads as the same "bubble" as the polar plot's scatter markers. */
    .swell-rank-bubble {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      display: inline-block;
    }
    /* Empty rows (see renderSwellTable) pad the table out to a constant
       MAX_SWELL_CLUSTERS rows regardless of how many swells were actually
       detected this frame — an outline-only bubble (no fill) marks the slot
       as unoccupied rather than implying a real, colored swell. */
    .swell-rank-bubble-empty {
      background: transparent;
      border: 1px solid #ccc;
      width: 7px;
      height: 7px;
    }

    /* Collapsible swell table — now sits above the polar/spectral plots.
       Collapsed state is tracked in JS (swellTableOpen) and re-applied after
       every re-render so it survives frame changes/playback instead of
       resetting open on every tick. */
    .swell-table-wrapper {
      background: #f8f9fa;
      border-radius: 6px;
      border: 1px solid #e9ecef;
      overflow: hidden;
    }
    .swell-table-toggle {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 8px 10px;
      background: #eef1f4;
      border: none;
      border-bottom: 1px solid #e9ecef;
      cursor: pointer;
      font-size: 12px;
      font-weight: bold;
      color: #333;
      text-align: left;
    }
    .swell-table-toggle:hover { background: #e2e6ea; }
    .swell-table-toggle .toggle-icon {
      display: inline-block;
      transition: transform 0.15s ease;
    }
    /* Wind grade (Good/Fair/Poor, colored per grade), Effective Wind + compass
       direction, and significant wave height — left-justified right after
       "Swell Table" in the same header bar (see updateSwellTableHeader()).
       Normal weight and a muted color so it reads as secondary to the bold
       "Swell Table" label; empty (and takes up no space) when there's no
       wind/wave data for the current frame. */
    .swell-table-wind-info {
      font-weight: normal;
      font-size: 11px;
      color: #666;
    }
    .swell-table-toggle.collapsed .toggle-icon {
      transform: rotate(-90deg);
    }
    .swell-table-container {
      overflow-x: auto;
    }
    .swell-table-container.collapsed {
      display: none;
    }
    /* Fixed layout + explicit per-column widths (via <colgroup>) so the table
       sits at one compact size and never stretches to fill a wide window —
       it just leaves empty space in the panel instead. Column widths were
       picked to add up to something that fits a phone screen without the
       .swell-table-container's overflow-x ever having to kick in. */
    .swell-table {
      width: 312px;
      table-layout: fixed;
      border-collapse: collapse;
      font-size: 12px;
    }
    .swell-table th, .swell-table td {
      box-sizing: border-box;
      padding: 6px 6px;
      text-align: right;
      white-space: nowrap;
    }
    /* The "#" column is centered — its cells hold a vertically-stacked
       rank number + colored bubble (see .swell-rank-cell), not left-aligned
       text like the header wrapping in the other columns. */
    .swell-table th:first-child, .swell-table td:first-child {
      text-align: center;
    }
    .swell-table thead th {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.03em;
      color: #6c757d;
      border-bottom: 1px solid #dee2e6;
      /* Header text wraps (label on its own line, unit below via
         .table-unit) instead of forcing the column wide enough for
         "Energy (m²/Hz)" on one line — see .table-unit below. */
      white-space: normal;
      line-height: 1.25;
      vertical-align: bottom;
    }
    .swell-table thead th .table-unit {
      display: block;
      text-transform: none;
      font-weight: normal;
      letter-spacing: 0;
      color: #98a2ad;
      font-size: 9px;
    }
    .swell-table tbody tr:not(:last-child) td {
      border-bottom: 1px solid #eee;
    }
    /* Rank number over the colored bubble (see .swell-rank-bubble), centered
       in the "#" column. */
    .swell-rank-cell {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      font-size: 11px;
    }
    /* Placeholder rows (see renderSwellTable) — the table always renders
       MAX_SWELL_CLUSTERS rows so its height stays constant across frames
       regardless of how many swells were actually detected; rows beyond the
       real count are muted dashes rather than left blank or omitted. */
    .swell-table-row-empty td {
      color: #aaa;
    }

    .plots-grid {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .plot-box {
      height: 270px;
      width: 100%;
    }
    .tide-toggle-row {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      font-size: 12px;
      font-weight: bold;
      color: #333;
    }
    .tide-toggle-row label {
      display: flex;
      align-items: center;
      gap: 5px;
      cursor: pointer;
    }
    .tide-toggle-row input[type="checkbox"] {
      width: auto;
      cursor: pointer;
    }

    @media (min-width: 768px) {
      body { padding: 15px; }
      h2 { font-size: 1.5rem; text-align: left; }
      .plots-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
      }
      .full-width { grid-column: span 2; }
      .plot-box { height: 320px; }
      .slider-container { flex-direction: row; align-items: center; }
    }
  </style>
</head>
<body>

  <h2>🌊 Wave Dash <span id="appVersionLabel" class="version-badge"></span></h2>

  <div class="grid-container">
    <div class="panel">
      <div class="map-controls-row">

        <div class="map-col">
          <label style="font-size: 12px; font-weight: bold; margin-bottom: 4px;">Select Wave / Wind Buoy:</label>
          <div id="map"></div>
        </div>

        <div class="controls-col">
          <div class="params-grid">

            <div class="control-group">
              <label>Wave Station ID:</label>
              <input type="text" id="stationId" value="41159">
            </div>

            <div class="control-group">
              <label>Wind Station ID:</label>
              <input type="text" id="windStationId" value="CLKN7">
            </div>

            <div class="control-group span-full">
              <label>End Date & Time (EST/EDT):</label>
              <input type="datetime-local" id="startDate">
            </div>

            <div class="control-group">
              <label>Hours to Plot:</label>
              <input type="number" id="hoursToPlot" value="12" min="1" max="24">
            </div>

            <div class="control-group">
              <label>Period Limit (s):</label>
              <input type="number" id="periodLimit" value="18" min="5" max="30">
            </div>

            <div class="control-group">
              <label>Axis Limit (m²/Hz):</label>
              <input type="number" step="0.1" id="minYLimit" value="2.0" min="0.1">
            </div>

            <div class="control-group">
              <label>Worthy Energy:</label>
              <input type="number" step="0.1" id="surfEnergy" value="1.0">
            </div>

            <div class="control-group">
              <label>Worthy Period (s):</label>
              <input type="number" id="surfPeriod" value="9">
            </div>

            <div class="control-group">
              <label>Angle of Interest (°):</label>
              <input type="number" id="critAngle" value="120">
            </div>

            <div class="control-group">
              <label>Swell Thresh (m²/Hz):</label>
              <input type="number" step="0.05" id="peakThreshold" value="0.1">
            </div>

            <div class="control-group">
              <label>Beach Angle (°):</label>
              <input type="number" id="beachAngle" value="120" min="0" max="360">
              <select id="beachAnglePreset" class="beach-angle-preset" onchange="applyBeachAnglePreset(this.value)">
                <option value="" selected>Presets…</option>
                <option value="120">120° LH</option>
                <option value="205">205° PP</option>
                <option value="240">240° GM</option>
                <option value="240">240° Shack at BI</option>
                <option value="57"> 57° Turtle Hole</option>
                <option value="106">106° Spit E Side</option>
              </select>
            </div>

          </div>

          <button class="btn" id="fetchBtn" onclick="fetchAndProcessData()">Update</button>
          <div id="statusMsg" class="status-msg">Ready.</div>
        </div>

      </div>
    </div>

    <div class="panel">
      <div class="player-controls">
        <button class="player-btn" onclick="firstFrame()">⏮ First</button>
        <button class="player-btn" onclick="stepFrame(-1)">◀ Rev</button>
        <button class="player-btn" id="playBtn" onclick="togglePlay()">▶ Play</button>
        <button class="player-btn" onclick="stepFrame(1)">Next ▶</button>
        <button class="player-btn" onclick="lastFrame()">Last ⏭</button>

        <!-- Speed Dropdown -->
        <select id="speedSelect" class="speed-select" onchange="onSpeedChange()">
          <option value="2000">0.5x</option>
          <option value="1000" selected>1x</option>
          <option value="500">2x</option>
          <option value="250">4x</option>
        </select>
      </div>

      <div class="slider-container">
        <span id="timestampDisplay" style="font-weight: bold; text-align: center;">Loading...</span>
        <input type="range" id="timeSlider" min="0" max="0" value="0" oninput="onSliderMove(this.value)">
      </div>

      <div class="plots-grid" style="margin-top: 15px;">
        <!-- Swell Table: height/period/direction/face-height/energy per identified
             swell, ranked by energy — sits above the polar/spectral plots. Column
             widths are fixed (see .swell-table) so it never stretches with the
             window; unit labels wrap under each header (see .table-unit) instead
             of widening the column. The standalone legend bar that used to sit
             here (wind grade + Effective Wind, plus tappable swell badges) has
             been removed — the wind grade/Effective Wind/direction and overall
             significant wave height now live left-justified in this table's own
             header bar (see #swellTableWindInfo / updateSwellTableHeader()), and
             the swell badges are redundant with the table's own rows. -->
        <div class="full-width">
          <div class="swell-table-wrapper">
            <button type="button" class="swell-table-toggle" id="swellTableToggleBtn" onclick="toggleSwellTable()">
              <span class="toggle-icon">▾</span> Swell Table
              <span id="swellTableWindInfo" class="swell-table-wind-info"></span>
            </button>
            <div id="swellTableContainer" class="swell-table-container">
              <table class="swell-table">
                <colgroup>
                  <col style="width:28px">
                  <col style="width:56px">
                  <col style="width:50px">
                  <col style="width:58px">
                  <col style="width:52px">
                  <col style="width:68px">
                </colgroup>
                <thead>
                  <tr>
                    <th>#</th>
                    <th>Height<span class="table-unit">(ft)</span></th>
                    <th>Period<span class="table-unit">(s)</span></th>
                    <th>Direction<span class="table-unit">(°)</span></th>
                    <th>Face<span class="table-unit">(ft)</span></th>
                    <th>Energy<span class="table-unit">(m²/Hz)</span></th>
                  </tr>
                </thead>
                <tbody id="swellTableBody"></tbody>
              </table>
            </div>
          </div>
        </div>

        <div id="polarPlot" class="plot-box"></div>
        <div id="spectralPlot" class="plot-box"></div>

        <div class="tide-toggle-row full-width">
          <label><input type="checkbox" id="showTide" onchange="onShowTideToggle()"> Show Tide</label>
        </div>
        <div id="heatmapPlot" class="plot-box full-width"></div>
      </div>
    </div>
  </div>

  <script>
    /* =====================================================================
       CONFIGURATION & CONSTANTS
       ===================================================================== */
    // Versioning: MAJOR.MINOR.PATCH (e.g. v1.2.3)
    //   MAJOR — major/breaking changes (redesigns, removed/reworked features)
    //   MINOR — added functionality (new features)
    //   PATCH — tweaks (fixes, small adjustments, cleanup)
    // Bumped only at explicit "ready to push" points, not on every edit — see
    // the CHANGELOG project doc for what's shipped under each version and
    // what's still queued under Unreleased.
    const APP_VERSION = "2.0.0";
    document.getElementById('appVersionLabel').innerText = `v${APP_VERSION}`;

    const WORKER_URL = "https://noaa-wave-proxy.rwnster.workers.dev";
    const EARTH_RADIUS_MILES = 3958.8;
    const MILES_TO_METERS = 1609.34;
    const NEARBY_BUOY_RADIUS_MILES = 200;
    const PLAYBACK_INTERVAL_MS = 1000;
    const MAX_SWELL_CLUSTERS = 4;
    const PEAK_DETECT_MIN_FREQ_HZ = 0.05;
    const PEAK_DETECT_MAX_FREQ_HZ = 0.20;
    const MPS_TO_KNOTS = 1.94384;
    const M_TO_FT = 3.28084;
    // Heatmap x-axis: show at most this many tick labels. One hourly tick per
    // column reads fine for a day or less (<=24 columns, the common case); past
    // that, ticks are thinned to an even hour-step so labels stop bunching up
    // instead of growing denser with every extra hour plotted.
    const MAX_HEATMAP_TICKS = 24;
    // Heatmap y-axis (Period) floor. The buoy's own frequency bins bottom out
    // around a ~2s period, so the axis is floored there instead of at 0 — the
    // heatmap's real data then fills the whole visible axis with no gap at the
    // bottom for the tide overlay line to cross through. Shared with
    // buildTideOverlayTrace() so the tide line is scaled against the same
    // visible range as the heatmap itself.
    const HEATMAP_MIN_PERIOD_S = 2;

    // NOAA CO-OPS API (tide predictions), routed through the same proxy worker
    // as the NDBC buoy requests above — see buildProxyUrl().
    const TIDE_STATIONS_URL = "https://api.tidesandcurrents.noaa.gov/mdapi/prod/webapi/stations.json?type=tidepredictions";
    const TIDE_PREDICTIONS_URL = "https://api.tidesandcurrents.noaa.gov/api/prod/datagetter";
    // Padding added on each side of the plotted window when requesting hi/lo
    // predictions, so there's always a bracketing tide event to interpolate from
    // at both edges of the chart (a semidiurnal cycle is ~12.4h, so 24h is safe).
    const TIDE_QUERY_PADDING_MS = 24 * 60 * 60 * 1000;
    const TIDE_LINE_COLOR = 'rgb(91, 155, 213)'; // same ocean-blue hue as WATER_COLOR, full opacity for line visibility

    const SWELL_RANK_COLORS = ['#e6194B', '#3cb44b', '#ffe119', '#4363d8'];

    // 16-point compass rose, used to label a bearing (e.g. wind "from"
    // direction) as N/NE/SSW/etc. instead of raw degrees — see degreesToCompass().
    const COMPASS_16 = ['N', 'NNE', 'NE', 'ENE', 'E', 'ESE', 'SE', 'SSE',
                         'S', 'SSW', 'SW', 'WSW', 'W', 'WNW', 'NW', 'NNW'];

    const DEFAULTS = {
      periodLimit: 18,
      minYLimit: 2.0,
      surfEnergy: 1.0,
      surfPeriod: 9,
      beachAngle: 135
    };

    // Wind quality cutoffs (Effective Wind, kts): below "Clean" reads green,
    // between "Clean" and "Poor" reads orange (fair), at/above "Poor" reads red.
    // Onshore is flat regardless of exact angle; the offshore side is linearly
    // interpolated through the 45°-offshore anchor down to dead offshore. See
    // getWindQualityCutoffs() for how these three anchors are blended.
    //
    // Not user-editable in the UI by design — these are tuned in code as
    // experience/feedback comes in, rather than exposed as controls.
    const WIND_GRADE_CUTOFFS = {
      onshoreClean: 4,
      onshoreFair: 7,
      off45Clean: 8,
      off45Fair: 16,
      deadOffClean: 12,
      deadOffFair: 20
    };

    // Status colors (validated via the dataviz skill's palette checker) —
    // reserved for this good/fair/poor read and never reused as a categorical
    // series color. "fair" is a darker burnt-amber (not the more typical bright
    // caution-orange) specifically so the wind arrow reads clearly against the
    // WATER_COLOR/SAND_COLOR polar backgrounds — validated at 4.95:1 contrast
    // vs the water half and 5.43:1 vs the sand half (both clear the 3:1 floor;
    // the original bright orange was 1.11:1 / 1.22:1), while still passing CVD
    // separation and the normal-vision floor against clean/poor.
    const WIND_GRADE_COLORS = {
      clean: '#0ca30c', // good
      fair: '#7a4008',  // caution
      poor: '#d03b3b'   // critical
    };

    // Wind speed label on the polar plot: fixed black regardless of grade color,
    // so it reads clearly against both the water and sand backgrounds.
    const WIND_LABEL_COLOR = '#000000';

    // Validated with the dataviz skill's palette checker (CVD delta-E 18.6, normal-vision
    // delta-E 22.7 — well clear of the safe floors) so the two halves stay distinguishable
    // for colorblind viewers, not just by eye.
    const WATER_COLOR = 'rgba(91, 155, 213, 0.5)';   // ocean blue
    const SAND_COLOR = 'rgba(217, 165, 102, 0.55)';  // beach tan

    const afmhotYellowCap = [
      [0.0, '#000000'],
      [0.2, '#660000'],
      [0.5, '#CC3300'],

    const plotlyConfig = {

    let currentBuoyLocation = null;

    let tideData = null; // [{ utcMs, height }, ...] sorted ascending, or null if unavailable
    let resolvedTideStation = null; // { id, name, lat, lon, distanceMiles } for the station tideData came from, or null

    const fallbackBuoyDatabase = [
      { id: "41159", name: "41159 - Onslow Bay Outer, NC", lat: 34.211, lon: -76.944 },
      { id: "CLKN7", name: "CLKN7 - Cape Lookout, NC", lat: 34.622, lon: -76.525 },
      { id: "41013", name: "41013 - Frying Pan Shoals, NC", lat: 33.436, lon: -77.743 },
      { id: "41036", name: "41036 - Onslow Bay Inner, NC", lat: 34.207, lon: -76.949 },
      { id: "41002", name: "41002 - South Hatteras, NC", lat: 31.759, lon: -74.936 },
      { id: "41004", name: "41004 - Edisto, SC", lat: 32.502, lon: -79.099 },
      { id: "41008", name: "41008 - Grays Reef, GA", lat: 31.400, lon: -80.866 },
      { id: "41009", name: "41009 - Canaveral 20 NM East, FL", lat: 28.526, lon: -80.188 },
      { id: "41010", name: "41010 - Canaveral 120 NM East, FL", lat: 28.878, lon: -78.485 },
      { id: "44014", name: "44014 - Virginia Beach, VA", lat: 36.611, lon: -74.836 },
      { id: "44025", name: "44025 - Long Island, NY", lat: 40.251, lon: -73.164 }

    /* =====================================================================
       WIND METRICS
       ===================================================================== */
    // Effective Wind = Mean Wind + (Gust - Mean Wind) / 3
    // The sustained/mean wind speed, nudged up by a third of the gust's excess
    // over the mean — so gustier conditions read as a higher effective wind
    // even when the mean speed alone is the same.
    function calculateEffectiveWind(wind) {
      if (!wind) return null;
      return wind.speedKts + (wind.gustKts - wind.speedKts) / 3;
    }

    // Compass-point label (N, NE, SSW, ...) for a bearing in degrees, rounded
    // to the nearest of the 16 points in COMPASS_16.
    function degreesToCompass(deg) {
      const normalized = ((deg % 360) + 360) % 360;
      return COMPASS_16[Math.round(normalized / 22.5) % 16];
    }

    // Smallest angle (0-180°) between two compass bearings.
    function angularDistance(a, b) {
      const diff = Math.abs(a - b) % 360;
      return diff > 180 ? 360 - diff : diff;
    }

    // 0° = dead offshore (wind blows straight out to sea, along the beach's
    // seaward bearing). 180° = dead onshore (wind blows straight in at the beach).
    // landFacingAngle is the bearing wind comes FROM when it's dead offshore —
    // i.e. Beach Angle + 180° (see the water/sand background comment above).
    function getOffshoreAngle(windFromDir, landFacingAngle) {
      return angularDistance(windFromDir, landFacingAngle);
    }

    // Blends the three configured anchor points (onshore / 45°-offshore / dead
    // offshore) into a Clean/Poor cutoff pair for the wind's actual angle.
    // Onshore is flat (any onshore angle uses the same cutoffs); the offshore
    // side linearly interpolates in two segments through the 45° anchor.
    function getWindQualityCutoffs(offAngle, g) {
      if (offAngle >= 90) {
        return { clean: g.onshoreClean, fair: g.onshoreFair };
      }
      if (offAngle <= 45) {
        const t = offAngle / 45; // 0 at dead offshore -> 1 at 45° offshore
        return {
          clean: g.deadOffClean + (g.off45Clean - g.deadOffClean) * t,
          fair: g.deadOffFair + (g.off45Fair - g.deadOffFair) * t
        };
      }
      const t = (offAngle - 45) / 45; // 0 at 45° offshore -> 1 at onshore boundary
      return {
        clean: g.off45Clean + (g.onshoreClean - g.off45Clean) * t,
        fair: g.off45Fair + (g.onshoreFair - g.off45Fair) * t
      };
    }

    // Shared grading logic: Effective Wind graded against the direction-dependent
    // Clean/Poor cutoffs, returned as a { label, color } pair. "clean"/"poor" are
    // the internal cutoff names (see WIND_GRADE_CUTOFFS); the user-facing labels
    // are Good/Fair/Poor.
    function getWindGradeInfo(effectiveWind, windFromDir, landFacingAngle, gradeCutoffs) {
      const offAngle = getOffshoreAngle(windFromDir, landFacingAngle);
      const { clean, fair } = getWindQualityCutoffs(offAngle, gradeCutoffs);
      if (effectiveWind < clean) return { label: 'Good', color: WIND_GRADE_COLORS.clean };
      if (effectiveWind < fair) return { label: 'Fair', color: WIND_GRADE_COLORS.fair };
      return { label: 'Poor', color: WIND_GRADE_COLORS.poor };
    }

    /* =====================================================================
       CONTROL PANEL HELPERS
       ===================================================================== */
    // Plain `|| DEFAULTS.x` (still used above for a few legacy fields) silently
    // discards a user-entered 0, which is a valid value for several of these
    // fields (e.g. a due-north Beach Angle) — so this checks for NaN explicitly.
    function parseNumOrDefault(elementId, defaultValue) {
      const v = parseFloat(document.getElementById(elementId).value);
      return Number.isNaN(v) ? defaultValue : v;
    }

    function getUserSettings() {
      return {
        stationId: document.getElementById('stationId').value.trim(),
        windStationId: document.getElementById('windStationId').value.trim(),
        hoursToPlot: parseInt(document.getElementById('hoursToPlot').value),
