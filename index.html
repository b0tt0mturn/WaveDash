<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wave Dash - Live Interactive Spectral Analysis</title>
  
  <!-- Leaflet CSS & JS for Interactive Map -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  
  <!-- Plotly.js for Dynamic Vector Charts -->
  <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>

  <style>
    body { 
      font-family: Arial, sans-serif; 
      margin: 0; 
      padding: 10px; 
      background: #f4f6f8; 
      box-sizing: border-box;
    }
    h2 { 
      margin-top: 0; 
      color: #1a252f; 
      font-size: 1.3rem; 
      text-align: center;
    }
    
    .grid-container { 
      display: flex; 
      flex-direction: column; 
      gap: 15px; 
    }
    .panel { 
      background: white; 
      padding: 12px; 
      border-radius: 8px; 
      box-shadow: 0 2px 5px rgba(0,0,0,0.1); 
    }

    /* Side-by-Side Map & Parameters Container */
    .map-controls-row {
      display: flex;
      flex-direction: row;
      gap: 12px;
      align-items: stretch;
    }

    .map-col {
      flex: 1.2;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .controls-col {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-width: 0;
    }

    #map { 
      height: 100%; 
      min-height: 220px;
      width: 100%; 
      border-radius: 6px; 
    }

    .control-group { 
      margin-bottom: 4px; 
    }
    .control-group label { 
      display: block; 
      font-size: 11px; 
      font-weight: bold; 
      margin-bottom: 2px; 
      white-space: nowrap;
    }
    .control-group input, .control-group select { 
      width: 100%; 
      padding: 5px; 
      box-sizing: border-box; 
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 12px;
    }

    .btn { 
      background: #007bff; 
      color: white; 
      border: none; 
      padding: 8px 10px; 
      border-radius: 4px; 
      cursor: pointer; 
      width: 100%; 
      margin-top: 6px;
      font-weight: bold;
      font-size: 13px;
    }
    .btn:hover { background: #0056b3; }
    .status-msg { font-size: 10px; color: #6c757d; margin-top: 4px; font-style: italic; text-align: center; }
    
    /* Player Controls */
    .player-controls { 
      display: flex; 
      gap: 4px; 
      align-items: center; 
      justify-content: space-between; 
      margin-bottom: 10px; 
    }
    .player-btn { 
      flex: 1;
      padding: 8px 4px; 
      font-weight: bold; 
      font-size: 12px;
      cursor: pointer; 
      background: #e9ecef; 
      border: 1px solid #ced4da; 
      border-radius: 4px; 
    }
    .player-btn:hover { background: #dee2e6; }
    .slider-container { display: flex; flex-direction: column; gap: 5px; margin-top: 5px; }
    .slider-container input { width: 100%; }

    /* Plot Layout */
    .plots-grid { 
      display: flex; 
      flex-direction: column; 
      gap: 15px; 
    }
    .plot-box { 
      height: 300px; 
      width: 100%;
    }

    /* Desktop View Overrides */
    @media (min-width: 768px) {
      body { padding: 15px; }
      h2 { font-size: 1.5rem; text-align: left; }
      .plots-grid { 
        display: grid; 
        grid-template-columns: 1fr 1fr; 
      }
      .full-width { grid-column: span 2; }
      .plot-box { height: 360px; }
      .slider-container { flex-direction: row; align-items: center; }
    }
  </style>
</head>
<body>

  <h2>🌊 Wave Dash - Ocean Wave Spectral Dashboard</h2>

  <div class="grid-container">
    <!-- Map & Parameters Panel -->
    <div class="panel">
      <div class="map-controls-row">
        
        <!-- Left Side: Interactive Map -->
        <div class="map-col">
          <label style="font-size: 12px; font-weight: bold; margin-bottom: 4px;">Select Wave Buoy:</label>
          <div id="map"></div>
        </div>

        <!-- Right Side: Parameters & Controls -->
        <div class="controls-col">
          <div class="control-group">
            <label>Station ID:</label>
            <input type="text" id="stationId" value="41159">
          </div>
          
          <div class="control-group">
            <label>Hours to Plot:</label>
            <input type="number" id="hoursToPlot" value="12" min="1" max="24">
          </div>

          <div class="control-group">
            <label>Crit Angle (°):</label>
            <input type="number" id="critAngle" value="120">
          </div>

          <div class="control-group">
            <label>Crit Period (s):</label>
            <input type="number" id="critPeriod" value="9">
          </div>

          <div class="control-group">
            <label>Peak Thresh (m²/Hz):</label>
            <input type="number" step="0.05" id="peakThreshold" value="0.1">
          </div>

          <button class="btn" id="fetchBtn" onclick="fetchAndProcessData()">Update</button>
          <div id="statusMsg" class="status-msg">Ready.</div>
        </div>

      </div>
    </div>

    <!-- Plots & Timeline Player Panel -->
    <div class="panel">
      <!-- Media Player Bar -->
      <div class="player-controls">
        <button class="player-btn" onclick="firstFrame()">⏮ First</button>
        <button class="player-btn" onclick="stepFrame(-1)">◀ Rev</button>
        <button class="player-btn" id="playBtn" onclick="togglePlay()">▶ Play</button>
        <button class="player-btn" onclick="stepFrame(1)">Next ▶</button>
        <button class="player-btn" onclick="lastFrame()">Last ⏭</button>
      </div>

      <div class="slider-container">
        <span id="timestampDisplay" style="font-weight: bold; text-align: center;">Loading...</span>
        <input type="range" id="timeSlider" min="0" max="0" value="0" oninput="onSliderMove(this.value)">
      </div>

      <!-- Live Plots -->
      <div class="plots-grid" style="margin-top: 15px;">
        <div id="polarPlot" class="plot-box"></div>
        <div id="spectralPlot" class="plot-box"></div>
        <div id="heatmapPlot" class="plot-box full-width"></div>
      </div>
    </div>
  </div>

  <script>
    // --- Global Application State ---
    let timeSeriesData = [];
    let currentFrameIdx = 0;
    let isPlaying = false;
    let playInterval = null;

    // --- Interactive Map Setup ---
    const map = L.map('map').setView([31.0, -78.5], 5);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '© OpenStreetMap'
    }).addTo(map);

    const buoys = [
      { id: "41159", name: "41159 - Onslow Bay Outer, NC", lat: 34.211, lon: -76.944 },
      { id: "41009", name: "41009 - CANAVERAL 20 NM East, FL", lat: 28.508, lon: -80.185 },
      { id: "41010", name: "41010 - CANAVERAL 120 NM East, FL", lat: 28.860, lon: -78.478 }
    ];

    buoys.forEach(b => {
      const marker = L.marker([b.lat, b.lon]).addTo(map);
      marker.bindPopup(`<b>Station ${b.id}</b><br>${b.name}`);
      marker.on('click', () => {
        document.getElementById('stationId').value = b.id;
        fetchAndProcessData();
      });
    });

    // --- Cloudflare Worker Fetch Implementation ---
    async function fetchNDBCFile(stationId, ext) {
      const targetUrl = `https://www.ndbc.noaa.gov/data/realtime2/${stationId}.${ext}`;
      
      const WORKER_URL = "https://noaa-wave-proxy.rwnster.workers.dev";
      const proxyUrl = `${WORKER_URL}?url=${encodeURIComponent(targetUrl)}`;

      const response = await fetch(proxyUrl);
      
      if (!response.ok) {
        throw new Error(`HTTP ${response.status} from Cloudflare worker while fetching .${ext}`);
      }

      const text = await response.text();
      
      if (!text || text.trim().length === 0 || text.includes("403 Forbidden")) {
        throw new Error(`Invalid data payload received for .${ext}`);
      }

      return parseNDBCFormat(text);
    }

    function parseNDBCFormat(text) {
      const lines = text.trim().split('\n');
      const timestamps = [];
      let frequencies = [];
      const matrices = [];

      for (let line of lines) {
        line = line.trim();
        if (line.startsWith('#') || !line) continue;

        const parts = line.split(/\s+/);
        if (parts.length < 6) continue;

        const matches = [...line.matchAll(/([-+]?\d+(?:\.\d+)?)\s+\(([-+]?\d+(?:\.\d+)?)\)/g)];
        if (matches.length === 0) continue;

        if (frequencies.length === 0) {
          frequencies = matches.map(m => parseFloat(m[2]));
        }

        const dateStr = `${parts[0]}-${parts[1].padStart(2,'0')}-${parts[2].padStart(2,'0')} ${parts[3].padStart(2,'0')}:${parts[4].padStart(2,'0')} UTC`;
        timestamps.push(dateStr);
        matrices.push(matches.map(m => parseFloat(m[1])));
      }
      return { timestamps, frequencies, matrices };
    }

    // --- Main Data Pipeline ---
    async function fetchAndProcessData() {
      pause();
      const status = document.getElementById('statusMsg');
      const stationId = document.getElementById('stationId').value;
      const hoursToPlot = parseInt(document.getElementById('hoursToPlot').value);

      try {
        status.innerText = "Fetching buoy data via worker...";
        const [spec, alpha1, alpha2] = await Promise.all([
          fetchNDBCFile(stationId, 'data_spec'),
          fetchNDBCFile(stationId, 'swdir'),
          fetchNDBCFile(stationId, 'swdir2')
        ]);

        status.innerText = "Processing spectral matrices...";

        const framesCount = Math.min(hoursToPlot, spec.timestamps.length);
        timeSeriesData = [];

        for (let i = framesCount - 1; i >= 0; i--) {
          timeSeriesData.push({
            timestamp: spec.timestamps[i],
            frequencies: spec.frequencies,
            energy: spec.matrices[i],
            alpha1: alpha1.matrices[i],
            alpha2: alpha2.matrices[i]
          });
        }

        const slider = document.getElementById('timeSlider');
        slider.max = timeSeriesData.length - 1;
        slider.value = timeSeriesData.length - 1;
        currentFrameIdx = timeSeriesData.length - 1;

        renderCurrentFrame();
        status.innerText = "Updated successfully.";

      } catch (err) {
        status.innerText = "Fetch error.";
        alert("Error fetching or parsing buoy data: " + err.message);
      }
    }

    // --- Peak Detection Logic ---
    function analyzeFrame(frame) {
      const minFreq = 0.05, maxFreq = 0.20;
      const peakThresh = parseFloat(document.getElementById('peakThreshold').value);
      
      const freqs = frame.frequencies;
      const periods = freqs.map(f => 1 / f);
      const E = frame.energy;
      const D1 = frame.alpha1;

      const clusters = [];
      for (let i = 1; i < freqs.length - 1; i++) {
        if (freqs[i] >= minFreq && freqs[i] <= maxFreq) {
          if (E[i] >= E[i-1] && E[i] >= E[i+1] && E[i] >= peakThresh) {
            clusters.push({
              period: periods[i],
              energy: E[i],
              direction: D1[i]
            });
          }
        }
      }
      return clusters.sort((a,b) => b.energy - a.energy).slice(0, 4);
    }

    // --- Plotting Engine ---
    function renderCurrentFrame() {
      if (!timeSeriesData.length) return;

      const frame = timeSeriesData[currentFrameIdx];
      document.getElementById('timestampDisplay').innerText = frame.timestamp;

      const periods = frame.frequencies.map(f => 1 / f);
      const clusters = analyzeFrame(frame);

      // 1. Polar Plot Fix:
      // Plotly measures radial axis angle relative to the plot layout's 0° direction.
      // With rotation: 90 (North at top), 0° points East (90° compass direction).
      // Placing radial axis at -45° offsets it 45° counter-clockwise from 0°, positioning labels cleanly at 315° (NW).
      const polarData = [
        {
          type: 'scatterpolar',
          mode: 'markers+text',
          r: clusters.map(c => c.period),
          theta: clusters.map(c => c.direction),
          text: clusters.map((c, i) => `Swell ${i+1}`),
          textposition: 'top right',
          marker: {
            size: clusters.map(c => Math.max(c.energy * 25, 12)),
            color: clusters.map(c => c.energy),
            colorscale: 'Jet',
            showscale: false
          }
        }
      ];

      const polarLayout = {
        title: { text: `Peak Swells (Polar)`, font: { size: 14 } },
        polar: {
          angularaxis: { direction: "clockwise", rotation: 90 },
          radialaxis: { 
            range: [0, 18],
            angle: -45,
            tickangle: -45
          }
        },
        margin: { t: 40, b: 20, l: 30, r: 30 },
        autosize: true
      };

      Plotly.newPlot('polarPlot', polarData, polarLayout, {responsive: true});

      // 2. Spectral Density Line Plot
      const maxEnergy = Math.max(...frame.energy);
      const yMax = Math.max(2.0, maxEnergy * 1.05);

      const spectralData = [
        {
          x: periods,
          y: frame.energy,
          type: 'scatter',
          mode: 'lines',
          name: 'Energy Density',
          line: { color: 'blue' }
        }
      ];

      const critPeriod = parseFloat(document.getElementById('critPeriod').value);

      const spectralLayout = {
        title: { text: `Energy Density vs Period`, font: { size: 14 } },
        xaxis: { title: 'Period (s)', range: [0, 18] },
        yaxis: { title: 'Energy (m²/Hz)', range: [0, yMax] },
        margin: { t: 40, b: 40, l: 40, r: 20 },
        shapes: [
          { type: 'line', x0: critPeriod, x1: critPeriod, y0: 0, y1: yMax, line: { color: 'blue', dash: 'dash' } }
        ],
        autosize: true
      };

      Plotly.newPlot('spectralPlot', spectralData, spectralLayout, {responsive: true});

      // 3. Render/Update Heatmap with Dynamic Vertical Line Marker
      renderHeatmap();
    }

    function renderHeatmap() {
      const zValues = [];
      const yValues = timeSeriesData[0].frequencies.map(f => 1 / f);
      const xValues = timeSeriesData.map((_, idx) => `Hr ${idx}`);

      for (let j = 0; j < yValues.length; j++) {
        const row = [];
        for (let i = 0; i < timeSeriesData.length; i++) {
          row.push(timeSeriesData[i].energy[j]);
        }
        zValues.push(row);
      }

      const heatmapData = [{
        z: zValues,
        x: xValues,
        y: yValues,
        type: 'heatmap',
        colorscale: 'Jet'
      }];

      const heatmapLayout = {
        title: { text: `Spectral Density Heatmap Over Time`, font: { size: 14 } },
        xaxis: { title: 'Timeline Index' },
        yaxis: { title: 'Period (s)', range: [0, 20] },
        margin: { t: 40, b: 40, l: 40, r: 20 },
        autosize: true,
        shapes: [
          {
            type: 'line',
            xref: 'x',
            yref: 'paper',
            x0: `Hr ${currentFrameIdx}`,
            x1: `Hr ${currentFrameIdx}`,
            y0: 0,
            y1: 1,
            line: {
              color: 'white',
              width: 3
            }
          }
        ]
      };

      Plotly.newPlot('heatmapPlot', heatmapData, heatmapLayout, {responsive: true});
    }

    // --- Media Controls Engine ---
    function togglePlay() {
      if (isPlaying) {
        pause();
      } else {
        play();
      }
    }

    function play() {
      isPlaying = true;
      document.getElementById('playBtn').innerText = "⏸ Pause";
      playInterval = setInterval(() => {
        if (currentFrameIdx >= timeSeriesData.length - 1) {
          currentFrameIdx = 0;
        } else {
          currentFrameIdx++;
        }
        document.getElementById('timeSlider').value = currentFrameIdx;
        renderCurrentFrame();
      }, 1000);
    }

    function pause() {
      isPlaying = false;
      document.getElementById('playBtn').innerText = "▶ Play";
      if (playInterval) clearInterval(playInterval);
    }

    function stepFrame(dir) {
      pause();
      currentFrameIdx = Math.max(0, Math.min(timeSeriesData.length - 1, currentFrameIdx + dir));
      document.getElementById('timeSlider').value = currentFrameIdx;
      renderCurrentFrame();
    }

    function firstFrame() {
      pause();
      currentFrameIdx = 0;
      document.getElementById('timeSlider').value = currentFrameIdx;
      renderCurrentFrame();
    }

    function lastFrame() {
      pause();
      currentFrameIdx = timeSeriesData.length - 1;
      document.getElementById('timeSlider').value = currentFrameIdx;
      renderCurrentFrame();
    }

    function onSliderMove(val) {
      pause();
      currentFrameIdx = parseInt(val);
      renderCurrentFrame();
    }

    // Initialize App on Load
    window.onload = fetchAndProcessData;
  </script>
</body>
</html>
