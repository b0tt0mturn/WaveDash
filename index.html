<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wave Dashboard</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #0d1117; /* GitHub dark mode background */
      color: #f0f6fc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 16px;
    }

    .card {
      background-color: #161b22;
      border: 1px solid #30363d;
      border-radius: 12px;
      padding: 16px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
      max-width: 100%;
      text-align: center;
    }

    h1 {
      font-size: 1.25rem;
      margin-bottom: 12px;
      color: #58a6ff;
    }

    .gif-container {
      width: 100%;
      overflow: hidden;
      border-radius: 8px;
    }

    img {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 8px;
    }

    .status {
      margin-top: 12px;
      font-size: 0.85rem;
      color: #8b949e;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>Wave Dash</h1>
    
    <div class="gif-container">
      <img src="spectral_analysis_animation.gif" alt="Recent Ocean Wave Data Animation">
    </div>

    <p class="status">Live Wave Data Animation</p>
  </div>

</body>
</html>
